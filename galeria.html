<!DOCTYPE html>

<body>
  <nav class="topo" data-nav></nav>
  <main class="conteudo">
    <p class="olho">As nossas fotos</p>

    </div>
    <p class="intro">Cachos, estas são as nossas. Clique para ampliar. Cada uma tem o nome do momento, para você não precisar adivinhar o que o meu coração já sabe.</p>

      <figure>
        <img data-zoom src="fotos/nos-dois-2.jpg" alt="Nós dois" />
